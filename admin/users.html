<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Matrimonial Admin Panel</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    @media (max-width: 768px) {
      .table-responsive {
        display: none;
      }

      .mobile-cards-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .user-mobile-card {
        background: var(--ivory);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
    }

    @media (min-width: 769px) {
      .mobile-cards-list {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-icon">M</div>
        <div>
          <div class="sidebar-brand-title">Community Matrimony</div>
          <div class="sidebar-brand-subtitle">Admin Panel</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Navigation</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <span class="nav-link-icon">
                <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
              </span>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="approvals.html" class="nav-link">
              <span class="nav-link-icon">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 16 14"/></svg>
              </span>
              <span>User Approvals</span>
              <span class="nav-badge pending-approvals-badge" style="display: none;">0</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="add-profile.html" class="nav-link">
              <span class="nav-link-icon">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
              </span>
              <span>Add Profile</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="profiles.html" class="nav-link">
              <span class="nav-link-icon">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </span>
              <span>Profiles</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="users.html" class="nav-link active">
              <span class="nav-link-icon">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <span>Users</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="sidebar-footer-btn reset-btn reset-demo-btn">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Reset Demo Data
        </button>
        <button type="button" class="sidebar-footer-btn logout-btn">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button type="button" class="mobile-menu-toggle" aria-label="Toggle Navigation Menu">☰</button>
          <h1 class="page-title">Manage Registered Users</h1>
        </div>
        
        <div class="header-right">
          <span class="badge badge-demo">Demo Version</span>
          <div class="admin-profile">
            <div class="admin-avatar">SA</div>
            <div class="admin-info">
              <span class="admin-name">System Admin</span>
              <span class="admin-role">Administrator</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Body -->
      <div class="page-body">
        
        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-inputs">
            <!-- Search -->
            <div class="search-input-wrap">
              <span class="search-icon">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input type="text" id="user-search-input" class="form-control" placeholder="Search by user name, phone, or city...">
            </div>

            <!-- Status Filter -->
            <select id="user-status-filter" class="form-select" style="width: auto; min-width: 150px;">
              <option value="all">All Statuses</option>
              <option value="approved">Approved</option>
              <option value="pending">Pending</option>
              <option value="rejected">Rejected</option>
              <option value="blocked">Blocked</option>
            </select>
          </div>
        </div>

        <!-- Users Container Card -->
        <div class="card">
          <!-- Desktop Table View -->
          <div class="table-responsive">
            <table class="table" id="users-table">
              <thead>
                <tr>
                  <th>User Name</th>
                  <th>Masked Phone</th>
                  <th>City</th>
                  <th>Relationship</th>
                  <th>Status</th>
                  <th>Registration Date</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>

          <!-- Mobile Cards View -->
          <div class="mobile-cards-list" id="users-mobile-list">
            <!-- Rendered dynamically on mobile -->
          </div>
          
          <div id="users-empty-container"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
