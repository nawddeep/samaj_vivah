<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Matrimonial Admin Panel</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #FFF8EC 0%, #F5E8D3 100%);
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--maroon), var(--maroon-deep));
      color: var(--cream);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 10px rgba(123, 30, 43, 0.25);
    }

    .brand-title {
      font-family: var(--font-heading);
      color: var(--maroon);
      font-size: 1.6rem;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-top: 0.25rem;
    }

    .demo-credentials-box {
      background-color: var(--gold-light);
      border: 1px dashed var(--gold);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--gold-dark);
    }

    .demo-credentials-box code {
      background: rgba(255, 255, 255, 0.8);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
      color: var(--maroon);
    }

    .password-input-wrap {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem;
    }

    .alert-danger {
      background-color: var(--danger-bg);
      border: 1px solid rgba(179, 38, 30, 0.3);
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">M</div>
      <h1 class="brand-title">Community Matrimony</h1>
      <p class="brand-subtitle">Admin Portal • Management Dashboard</p>
      <div style="margin-top: 0.5rem;">
        <span class="badge badge-demo">Demo Version</span>
      </div>
    </div>

    <!-- Demo Credentials Info Box -->
    <div class="demo-credentials-box">
      <strong style="display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.3rem;">
        <svg class="svg-icon" viewBox="0 0 24 24" style="color: var(--gold-dark);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Demo Login Credentials:
      </strong>
      Email: <code>admin@demo.com</code><br>
      Password: <code>Admin@123</code>
    </div>

    <div id="login-alert" class="alert-danger" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="form-group" id="group-email">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          class="form-control" 
          placeholder="admin@demo.com" 
          required 
          autocomplete="email"
        >
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="form-group" id="group-password">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <div class="password-input-wrap">
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">Show</button>
        </div>
        <div class="invalid-feedback">Password is required.</div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Sign In to Admin Panel
      </button>
    </form>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-password-btn');
      const alertBox = document.getElementById('login-alert');

      // Toggle Password Visibility
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.textContent = isPassword ? 'Hide' : 'Show';
      });

      // Handle Login Form Submit
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        // Clear previous error states
        document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));
        emailInput.classList.remove('is-invalid');
        passwordInput.classList.remove('is-invalid');

        const validation = Validators.validateLogin(emailInput.value, passwordInput.value);

        if (!validation.isValid) {
          if (validation.errors.email) {
            document.getElementById('group-email').classList.add('has-error');
            emailInput.classList.add('is-invalid');
          }
          if (validation.errors.password) {
            document.getElementById('group-password').classList.add('has-error');
            passwordInput.classList.add('is-invalid');
          }
          return;
        }

        // Perform authentication
        const result = Auth.login(emailInput.value.trim(), passwordInput.value.trim());

        if (result.success) {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          alertBox.textContent = result.message;
          alertBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
