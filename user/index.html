<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B1E2B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%237B1E2B%27 stroke=%27%23C9A24D%27 stroke-width=%274%27/%3E%3Ccircle cx=%2726%27 cy=%2732%27 r=%2711%27 fill=%27none%27 stroke=%27%23FFF8EC%27 stroke-width=%273%27/%3E%3Ccircle cx=%2738%27 cy=%2732%27 r=%2711%27 fill=%27none%27 stroke=%27%23FFF8EC%27 stroke-width=%273%27/%3E%3C/svg%3E">
  <title>Samaj Vivah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="phone" id="app">
    <div class="access-banner" id="access-banner" role="status" hidden></div>
    <main class="stage" id="stage"></main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main" hidden>
      <button type="button" data-tab="home"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span><span>Home</span></button>
      <button type="button" data-tab="matches"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></span><span>Matches</span></button>
      <button type="button" data-tab="interests"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></span><span>Interests</span></button>
      <button type="button" data-tab="messages"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></span><span>Messages</span></button>
      <button type="button" data-tab="account"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span><span>Account</span></button>
    </nav>

    <div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
    <div id="layer-root"></div>
  </div>

  <script src="../admin/js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
  <script src="js/screens.js"></script>
  <script>Router.start();</script>
</body>
</html>
